# chikuden-hojokin.jp へ配信する。
#
# このドメインの DNS は既に Xserver（85.131.221.80 / ns*.xserver.jp）を向いて
# いるが、public_html に何も置かれておらずサーバの初期ページが出ていた。
# Next.js を静的書き出し（output: "export"）して、その中身を置く。
#
# 消す操作はしない。古いファイルが残っても上書きで最新になる。
name: Deploy to Xserver

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build (static export)
        run: npm run build

      - name: Deploy to Xserver via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: 10022
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './out/*'
          remote_path: '/home/xs501620/chikuden-hojokin.jp/public_html/'
          sftp_only: true
          delete_remote_files: false
